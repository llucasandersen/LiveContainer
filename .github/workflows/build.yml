name: Xcode - Duo IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LiveContainer + SideStore with iOS 27.1
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      scheme: LiveContainer
      archive_path: archive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Verify Duo SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version > sdk-version.txt
          python3 -c "from pathlib import Path; v=Path('sdk-version.txt').read_text().strip(); assert tuple(map(int, v.split('.'))) >= (27,1), v; print('Building with iOS SDK', v)"
      - name: Archive unsigned ARM64 build
        run: |
          set -o pipefail
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release CODE_SIGNING_ALLOWED=NO | tee build.log | xcbeautify
      - name: Package LiveContainer and SideStore
        run: |
          sh .github/build_github.sh
          mv LiveContainer+SideStore.ipa LiveContainer+SideStore-Duo.ipa
      - name: Validate packaged Duo IPA
        run: python3 .github/validate_duo_ipa.py LiveContainer+SideStore-Duo.ipa
      - name: Upload Duo IPA and validation
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore-Duo.ipa
          path: |
            LiveContainer+SideStore-Duo.ipa
            duo-ipa-validation.json
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-build-log
          path: build.log
          if-no-files-found: ignore
